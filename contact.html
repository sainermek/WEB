<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Minecraft PvP Championship</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
    <header>
        <div class="header-brand">
            <img src="images/logo.png" alt="MCTiers Logo" class="logo-img">
            <h2>MCTiers League</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="active">Registration</a></li>
            </ul>
        </nav>
    </header>

    <aside>
        <h2>Instructions</h2>
        <p>Fill out your actual IGN and Discord tag to successfully pass the verification process.</p>
    </aside>

    <main>
        <h1>Player Registration</h1>
        <p>Join upcoming qualification duels.</p>

        <form>
            <div class="form-group">
                <label for="ign">Minecraft Username / IGN:</label>
                <input type="text" id="ign" placeholder="e.g. Steve_PvP">
            </div>

            <div class="form-group">
                <label for="email">Contact Email:</label>
                <input type="email" id="email" placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="discipline">Preferred Discipline:</label>
                <select id="discipline">
                    <option>Sword 1.9+</option>
                    <option>Axe PvP</option>
                    <option>Crystal PvP</option>
                    <option>Pot PvP</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experience">Experience & Discord Tag:</label>
                <textarea id="experience" rows="4" placeholder="Discord: tag#0000"></textarea>
            </div>

            <button type="submit" class="card-btn">Submit Application</button>
        </form>
    </main>

    <footer>
        <p>Created by: Batyrkhan Uvayev & Yermek Sain | 2026</p>
    </footer>
</div>

</body>
</html>
